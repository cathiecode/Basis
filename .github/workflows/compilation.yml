name: Automatic build

on: [push, pull_request]

jobs:
  # To setup secrets for client build, see https://game.ci/docs/github/activation
  # NOTE: For personal license, a dedicated account is recommended
  # NOTE: To generate the license file, open Unity 2018 on a project at least once
  check-secret:
    name: Check if secrets available
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      secret-is-set: ${{ steps.secret-is-set.outputs.defined }}
      android-secret-is-set: ${{ steps.android-secret-is-set.outputs.defined }}
    steps:
      - name: Check if secret is set, then set variable
        id: secret-is-set
        env:
          TMP_SECRET1: ${{ secrets.UNITY_LICENSE }}
          TMP_SECRET2: ${{ secrets.UNITY_EMAIL }}
          TMP_SECRET3: ${{ secrets.UNITY_PASSWORD }}
        if: "${{ env.TMP_SECRET1 != '' && env.TMP_SECRET2 != '' && env.TMP_SECRET3 != '' }}"
        run: echo "defined=true" >> $GITHUB_OUTPUT
      - name: Check if Android secrets are set, then set variable
        id: android-secret-is-set
        env:
          TMP_SECRET1: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TMP_SECRET2: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          TMP_SECRET3: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          TMP_SECRET4: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        if: "${{ env.TMP_SECRET1 != '' && env.TMP_SECRET2 != '' && env.TMP_SECRET3 != '' && env.TMP_SECRET4 != '' }}"
        run: echo "defined=true" >> $GITHUB_OUTPUT

  # ── Windows x64 ─────────────────────────────────────────────────────────────
  dlp-native-windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./dlp-native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build
        run: pwsh scripts/build-host.ps1

      - name: Stage Python stdlib
        shell: pwsh
        run: |
          $python = (uv python find 3.12).Trim()
          & $python scripts/stage_stdlib.py windows-x86_64 --python $python

      - name: CLI smoke test
        run: cargo run -p unity_dlp_cli --release -- version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity_dlp-windows-x64
          path: |
            dlp-native/unity_package/Plugins/x86_64/unity_dlp.dll
            dlp-native/unity_package/StreamingAssets/dlp/

  # ── macOS universal ──────────────────────────────────────────────────────────
  dlp-native-macos:
    name: macOS universal
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./dlp-native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # actions/setup-python on macos-latest installs a universal2 Python 3.12,
      # which PyO3 can use for both the native arm64 and the x86_64 cross-compile.
      - name: Install Python 3.12 (universal2)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install uv (for hatch_build.py in build.rs)
        uses: astral-sh/setup-uv@v5

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build universal dylib
        run: bash scripts/build-macos-universal.sh

      - name: Stage Python stdlib
        run: |
          "$PYO3_PYTHON" scripts/stage_stdlib.py macos-universal --python "$PYO3_PYTHON" --exclude-dirs test --exclude-dirs pip --exclude-dirs ensurepip

      - name: CLI smoke test
        run: cargo run -p unity_dlp_cli --release -- version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity_dlp-macos-universal
          path: |
            dlp-native/unity_package/Plugins/x86_64/unity_dlp.dylib
            dlp-native/unity_package/Plugins/x86_64/Python
            dlp-native/unity_package/StreamingAssets/dlp/

  # ── Linux x64 ───────────────────────────────────────────────────────────────
  dlp-native-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dlp-native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./dlp-native/target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build
        run: bash scripts/build-host.sh

      - name: Stage Python stdlib
        run: |
          PYTHON="$(uv python find 3.12)"
          "$PYTHON" scripts/stage_stdlib.py linux-x86_64 --python "$PYTHON"

      - name: CLI smoke test
        run: cargo run -p unity_dlp_cli --release --no-default-features --features js-quickjs -- version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity_dlp-linux-x64
          path: |
            dlp-native/unity_package/Plugins/x86_64/libunity_dlp.so
            dlp-native/unity_package/Plugins/x86_64/libpython*.so*
            dlp-native/unity_package/StreamingAssets/dlp/

  # ── Android arm64-v8a ────────────────────────────────────────────────────────
  dlp-native-android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dlp-native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Install libclang (for rquickjs-sys bindgen)
        run: sudo apt-get install -y libclang-dev

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Locate Android NDK and configure bindgen sysroot
        run: |
          NDK_DIR="$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/ | sort -V | tail -1)"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          NDK_SYSROOT="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$NDK_SYSROOT --target=aarch64-linux-android26" \
            >> "$GITHUB_ENV"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Download Termux Python 3.12 for aarch64
        run: |
          BASE="https://packages.termux.dev/apt/termux-main/pool/main/p/python"
          PYTHON_DEB="$(curl -fsSL "$BASE/" \
            | grep -oP 'python_[^"]+_aarch64\.deb' | sort -V | tail -1)"
          echo "==> $PYTHON_DEB"
          curl -fsSL "$BASE/$PYTHON_DEB" -o /tmp/python.deb
          mkdir -p /tmp/termux-extract
          cd /tmp/termux-extract && ar x /tmp/python.deb && tar xf data.tar.xz

      - name: Set up PYO3_CROSS_LIB_DIR for Android arm64
        run: |
          PREFIX="/tmp/termux-extract/data/data/com.termux/files/usr"
          mkdir -p python-android-lib
          # Detect the actual Python version shipped in the .deb
          LIBPY="$(find "$PREFIX/lib" -maxdepth 1 -name 'libpython3.*.so*' | sort -V | tail -1)"
          PY_VER="$(echo "$LIBPY" | grep -oP '(?<=libpython)\d+\.\d+')"
          echo "==> Found libpython${PY_VER}"
          cp -L "$LIBPY" "python-android-lib/libpython${PY_VER}.so"
          LIB_DIR="$(pwd)/python-android-lib"
          echo "PYO3_CROSS_LIB_DIR=$LIB_DIR" >> "$GITHUB_ENV"
          echo "PYO3_CROSS_PYTHON_VERSION=${PY_VER}" >> "$GITHUB_ENV"
          # PYO3_NO_PYTHON skips sysconfig parsing; without it pyo3-build-config reads
          # LIBDIR from the Termux sysconfig (/data/data/com.termux/...) which doesn't
          # exist on the runner, so the linker search path is wrong.
          echo "PYO3_NO_PYTHON=1" >> "$GITHUB_ENV"
          # Expose prefix for stdlib staging
          echo "TERMUX_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Build Android arm64-v8a
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --platform 26 \
            -- build -p unity_dlp_core --release \
            --no-default-features --features js-quickjs

      - name: Stage Python stdlib
        run: |
          python3 scripts/stage_stdlib.py android-arm64-v8a --prefix "$TERMUX_PREFIX"

      - name: Stage artifact
        run: |
          mkdir -p unity_package/Plugins/Android/libs/arm64-v8a
          cp target/aarch64-linux-android/release/libunity_dlp.so \
            unity_package/Plugins/Android/libs/arm64-v8a/
          LIBPY="$(find "$TERMUX_PREFIX/lib" -maxdepth 1 -name 'libpython3.*.so*' \
            | sort -V | tail -1)"
          cp -L "$LIBPY" unity_package/Plugins/Android/libs/arm64-v8a/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity_dlp-android-arm64
          path: |
            dlp-native/unity_package/Plugins/Android/libs/arm64-v8a/libunity_dlp.so
            dlp-native/unity_package/Plugins/Android/libs/arm64-v8a/libpython*.so*
            dlp-native/unity_package/StreamingAssets/dlp/

  # ── iOS arm64 ────────────────────────────────────────────────────────────────
  dlp-native-ios:
    name: iOS arm64
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./dlp-native
    env:
      PYO3_CROSS_PYTHON_VERSION: '3.12'
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install Python 3.12 (host — stdlib source for iOS)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python for iOS arm64 (python-apple-support)
        id: cache-py-ios
        uses: actions/cache@v4
        with:
          path: dlp-native/python-ios
          key: python-3.12-ios-support-b8

      - name: Download Python 3.12 for iOS (BeeWare python-apple-support)
        if: steps.cache-py-ios.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o Python-3.12-iOS-support.b8.tar.gz \
            "https://github.com/beeware/python-apple-support/releases/download/3.12-b8/Python-3.12-iOS-support.b8.tar.gz"
          mkdir python-ios
          tar -xzf Python-3.12-iOS-support.b8.tar.gz -C python-ios

      # python-apple-support ships Python.xcframework; PyO3 wants a lib dir with
      # libpython3.12.a. Create shim directories for both device and simulator.
      - name: Set up Python lib dirs for iOS device and simulator
        run: |
          DEVICE_FW="$(pwd)/python-ios/Python.xcframework/ios-arm64/Python.framework"
          SIM_FW_DIR="$(ls -d "$(pwd)/python-ios/Python.xcframework/"*simulator*/ | head -1)"
          SIM_FW="${SIM_FW_DIR%/}/Python.framework"
          mkdir -p python-ios-device-lib python-ios-sim-lib
          cp "${DEVICE_FW}/Python" python-ios-device-lib/libpython3.12.a
          cp "${SIM_FW}/Python"    python-ios-sim-lib/libpython3.12.a
          echo "CFLAGS=-I${DEVICE_FW}/Headers" >> "$GITHUB_ENV"
          echo "IOS_DEVICE_LIB=$(pwd)/python-ios-device-lib" >> "$GITHUB_ENV"
          echo "IOS_SIM_LIB=$(pwd)/python-ios-sim-lib"       >> "$GITHUB_ENV"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ios-cargo-

      - name: Build iOS device (arm64)
        run: |
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          PYO3_NO_PYTHON=1 PYO3_CROSS_LIB_DIR="$IOS_DEVICE_LIB" \
            cargo build -p unity_dlp_core --release --target aarch64-apple-ios \
            --no-default-features --features js-quickjs

      - name: Build iOS simulator (arm64)
        run: |
          export SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          PYO3_NO_PYTHON=1 PYO3_CROSS_LIB_DIR="$IOS_SIM_LIB" \
            cargo build -p unity_dlp_core --release --target aarch64-apple-ios-sim \
            --no-default-features --features js-quickjs

      - name: Stage Python stdlib
        run: |
          # python-apple-support only ships the compiled static lib + headers;
          # the stdlib comes from the macOS host Python installed above.
          # Exclude lib-dynload (macOS .so binaries — not usable on iOS; C
          # extensions are compiled into libpython3.12.a by python-apple-support).
          python3 scripts/stage_stdlib.py ios-arm64 \
            --exclude-dirs lib-dynload test

      - name: Stage artifact
        run: |
          mkdir -p unity_package/Plugins/iOS
          rm -rf unity_package/Plugins/iOS/unity_dlp.xcframework
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libunity_dlp.a \
            -library target/aarch64-apple-ios-sim/release/libunity_dlp.a \
            -output unity_package/Plugins/iOS/unity_dlp.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity_dlp-ios-arm64
          path: |
            dlp-native/unity_package/Plugins/iOS/unity_dlp.xcframework/
            dlp-native/unity_package/StreamingAssets/dlp/

  build-client:
    name: Build client for ${{ matrix.targetPlatform }}
    timeout-minutes: 100
    runs-on: ${{ matrix.buildPlatform }}
    permissions:
      actions: write # to allow us to manage cache
    env:
      projectPath: Basis
      buildName: Basis Unity
    strategy:
      fail-fast: false
      matrix:
        dlpNative:
          - unity_dlp-linux-x64
        targetPlatform:
          - StandaloneLinux64
        buildPlatform:
          - ubuntu-latest
        include:
          - buildPlatform: windows-2022
            targetPlatform: StandaloneWindows64
            dlpNative: unity_dlp-windows-x64
    needs: [check-secret, dlp-native-windows, dlp-native-linux]
    if: needs.check-secret.outputs.secret-is-set == 'true'
    steps:
      # We're running out of disk space in some cases. However, the actual build is happening in a docker container.
      # Therefore, we don't actually need most of the tools that github provides. This can save quite a bit of space.
      # Also consider https://github.com/easimon/maximize-build-space/, which pulls some other tricks.
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: matrix.buildPlatform == 'ubuntu-latest'
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: "Checkout repository"
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Restore Library cache"
        id: restore-cache
        timeout-minutes: 10
        uses: actions/cache/restore@v3
        with:
          path: ${{ env.projectPath }}/Library
          key: Library-${{ env.projectPath }}-${{ matrix.targetPlatform }}-client-${{ hashFiles(env.projectPath) }}
          restore-keys: Library-${{ env.projectPath }}-${{ matrix.targetPlatform }}-client-
      - name: "Create version string"
        id: version
        run: echo "gitversion=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: "Sanitize Linux client project"
        if: matrix.targetPlatform == 'StandaloneLinux64'
        shell: bash
        run: |
          python3 .github/scripts/sanitize_linux_client_ci.py "${projectPath}"
      # Fix docker not ready on windows
      - name: Ensure Docker service is running
        if: matrix.buildPlatform == 'windows-2022'
        shell: powershell
        run: |
          Start-Service docker
      - name: Wait for Docker to be ready
        if: matrix.buildPlatform == 'windows-2022'
        shell: powershell
        run: |
          $maxAttempts = 40
          for ($i=0; $i -lt $maxAttempts; $i++) {
            docker info > $null 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker is ready"
              exit 0
            }
            Write-Host "Waiting for Docker..."
            Start-Sleep -Seconds 3
          }
          throw "Docker did not become ready in time"
      - name: Install the latest version of uv for dlp-native
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install Python for dlp-native
        run: uv python install 3.12
      - name: Download dlp-native artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.dlpNative }}
          path: ./dlp-native-artifact
      - name: Copy dlp-native artifact into dlp-native unity_package folder (Windows Runner)
        if: matrix.buildPlatform == 'windows-2022'
        shell: powershell
        run: |
          Copy-Item -Verbose -Recurse -Force -Path ./dlp-native-artifact/* -Destination ./dlp-native/unity_package
      - name: Copy dlp-native artifact into dlp-native unity_package folder (Linux Runner)
        if: matrix.buildPlatform == 'ubuntu-latest'
        run: |
          cp -rv ./dlp-native-artifact/* ./dlp-native/unity_package
      - name: "Build Unity project"
        timeout-minutes: 100
        uses: BasisVR/unity-builder@main
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          buildName: ${{ env.buildName }}
          projectPath: ${{ env.projectPath }}
          targetPlatform: ${{ matrix.targetPlatform }}
          customParameters: ${{ startsWith(matrix.targetPlatform, 'Standalone') && '-standaloneBuildSubtarget Player' || '' }}
          versioning: Custom
          version: ${{ steps.version.outputs.gitversion }}
          linux64RemoveExecutableExtension: false
      - name: "Save Library Cache"
        uses: actions/cache/save@v3
        if: always() && github.ref_name == 'developer'
        with:
          path: ${{ env.projectPath }}/Library
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
      - name: "Only retain latest cache"
        if: always() && github.ref_name == 'developer'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_CACHE_IDS=$(gh cache list --sort created_at --key Library-${{ env.projectPath }}-${{ matrix.targetPlatform }}-client- --json id --jq '.[1:] | map(.id) | @sh')
          for cache_id in $OLD_CACHE_IDS; do
            echo "Deleting cache id: $cache_id"
            gh cache delete $cache_id
          done
      - name: "Upload client artifact"
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: Basis-Client-${{ matrix.targetPlatform }}
          path: |
            build/${{ matrix.targetPlatform }}
            !build/${{ matrix.targetPlatform }}/${{ env.buildName }}_BackUpThisFolder_ButDontShipItWithYourGame
      - name: "Upload client symbols artifact"
        timeout-minutes: 4
        uses: actions/upload-artifact@v4
        with:
          name: Basis-Symbols-Client-${{ matrix.targetPlatform }}
          path: |
            build/${{ matrix.targetPlatform }}/${{ env.buildName }}_BackUpThisFolder_ButDontShipItWithYourGame
      - name: Archive symbols
        uses: thedoctor0/zip-release@0.7.6
        if: github.ref_type == 'tag' && matrix.targetPlatform != 'Android'
        with:
          type: "zip"
          directory: build/${{ matrix.targetPlatform }}
          filename: "${{ github.workspace }}/Basis Unity ${{ matrix.targetPlatform }} Symbols.zip"
          # This uses a wildcard because this action doesn't work correctly with spaces in path.
          path: "*_BackUpThisFolder_ButDontShipItWithYourGame"
      # workaround for exclusions not working with spaces *or* wildcards.
      - name: Delete symbols
        if: github.ref_type == 'tag' && matrix.targetPlatform != 'Android'
        shell: bash
        run: >
          ${{ matrix.buildPlatform == 'ubuntu-latest' && 'sudo' || '' }}
          rm -rvf "build/${{ matrix.targetPlatform }}/${{ env.buildName }}_BackUpThisFolder_ButDontShipItWithYourGame"
      - name: Archive client
        uses: thedoctor0/zip-release@0.7.6
        if: github.ref_type == 'tag' && matrix.targetPlatform != 'Android'
        with:
          type: "zip"
          directory: build/${{ matrix.targetPlatform }}
          filename: "${{ github.workspace }}/Basis Unity ${{ matrix.targetPlatform }}.zip"
      - name: "Release client zip"
        if: github.ref_type == 'tag' && matrix.targetPlatform != 'Android'
        timeout-minutes: 5
        uses: "softprops/action-gh-release@v2"
        with:
          files: |
            ${{ github.workspace }}/Basis Unity ${{ matrix.targetPlatform }}.zip
            ${{ github.workspace }}/Basis Unity ${{ matrix.targetPlatform }} Symbols.zip
  build-client-android:
    name: Build client for Android
    timeout-minutes: 100
    runs-on: ubuntu-latest
    permissions:
      actions: write # to allow us to manage cache
    env:
      projectPath: Basis
      buildName: Basis Unity
    needs: [check-secret]
    if: needs.check-secret.outputs.secret-is-set == 'true' && needs.check-secret.outputs.android-secret-is-set == 'true'
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: "Checkout repository"
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Restore Library cache"
        id: restore-cache
        timeout-minutes: 10
        uses: actions/cache/restore@v3
        with:
          path: ${{ env.projectPath }}/Library
          key: Library-${{ env.projectPath }}-Android-client-${{ hashFiles(env.projectPath) }}
          restore-keys: Library-${{ env.projectPath }}-Android-client-
      - name: "Create version string"
        id: version
        run: echo "gitversion=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: "Build Unity project"
        timeout-minutes: 100
        uses: BasisVR/unity-builder@main
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          buildName: ${{ env.buildName }}
          projectPath: ${{ env.projectPath }}
          targetPlatform: Android
          customParameters: ""
          versioning: Custom
          version: ${{ steps.version.outputs.gitversion }}
          # TODO: make a decision on how we want to increment this.
          #  This number was chosen to be slightly larger than the version code used for 0.056B.
          androidVersionCode: 55
          androidExportType: androidPackage
          androidKeystoreName: BasisQuest # This file won't exist, but this property needs to exist.
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          linux64RemoveExecutableExtension: false
      - name: "Save Library Cache"
        uses: actions/cache/save@v3
        if: always() && github.ref_name == 'developer'
        with:
          path: ${{ env.projectPath }}/Library
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
      - name: "Only retain latest cache"
        if: always() && github.ref_name == 'developer'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_CACHE_IDS=$(gh cache list --sort created_at --key Library-${{ env.projectPath }}-Android-client- --json id --jq '.[1:] | map(.id) | @sh')
          for cache_id in $OLD_CACHE_IDS; do
            echo "Deleting cache id: $cache_id"
            gh cache delete $cache_id
          done
      - name: "Upload client artifact"
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: Basis-Client-Android
          path: |
            build/Android
            !build/Android/${{ env.buildName }}_BackUpThisFolder_ButDontShipItWithYourGame
      - name: "Upload client symbols artifact"
        timeout-minutes: 4
        uses: actions/upload-artifact@v4
        with:
          name: Basis-Symbols-Client-Android
          path: |
            build/Android/${{ env.buildName }}_BackUpThisFolder_ButDontShipItWithYourGame
      - name: "Release client apk"
        if: github.ref_type == 'tag'
        timeout-minutes: 5
        uses: "softprops/action-gh-release@v2"
        with:
          files: build/Android/${{ env.buildName }}.apk

  build-server:
    name: Build server on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - Basis Server
        runtimes:
          - linux-x64
          - linux-musl-x64
          - linux-musl-arm64
          - linux-arm64
          - win-x64
    steps:
      - name: "Checkout repository"
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Setup dotnet"
        timeout-minutes: 2
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: "Build server"
        timeout-minutes: 10
        run: "dotnet publish '${{ matrix.projectPath }}' -f net10.0 --self-contained --runtime '${{ matrix.runtimes }}' -o build -c Release"
      - name: "Upload server artifact"
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: Basis-Server-${{ matrix.runtimes }}
          path: "build"
      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.6
        if: github.ref_type == 'tag'
        with:
          type: "zip"
          directory: build
          filename: "Basis Server ${{ matrix.runtimes }}.zip"
      - name: "Release server zip"
        if: github.ref_type == 'tag'
        timeout-minutes: 5
        uses: "softprops/action-gh-release@v2"
        with:
          files: build/Basis Server ${{ matrix.runtimes }}.zip

  compile-unitypackages:
    name: Build .unitypackage files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Checkout repository"
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Produce SDK unitypackage."
        timeout-minutes: 5
        run: .github/scripts/unitypackagegen.sh sdk
      - name: "Produce full unitypackage."
        timeout-minutes: 5
        run: .github/scripts/unitypackagegen.sh full
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: unitypackage_upload
          path: |
            Basis/Basis.sdk.unitypackage
            Basis/Basis.full.unitypackage
      - name: "Release unitypackage"
        if: github.ref_type == 'tag'
        timeout-minutes: 5
        uses: "softprops/action-gh-release@v2"
        with:
          files: |
            Basis/Basis.sdk.unitypackage
            Basis/Basis.full.unitypackage
